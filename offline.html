<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión — YourBand</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f8fafc;--bg2:#ffffff;--text:#212529;--muted:#6c757d;--y:#f4623a;--border2:rgba(33,37,41,0.16);}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;}
  .card{max-width:320px;padding:32px 24px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;box-shadow:0 4px 20px rgba(33,37,41,0.06);}
  .emoji{font-size:40px;margin-bottom:12px;}
  h1{font-family:'Anton',sans-serif;font-size:26px;color:var(--y);letter-spacing:0.5px;margin-bottom:8px;}
  p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;}
  button{background:var(--y);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-family:'Anton',sans-serif;font-size:15px;letter-spacing:0.5px;cursor:pointer;}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎸</div>
    <h1>SIN CONEXIÓN</h1>
    <p>No se ha podido cargar esta página y todavía no está guardada para uso sin conexión. Tus grupos, canciones e instrumentos ya guardados siguen disponibles en la app.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
